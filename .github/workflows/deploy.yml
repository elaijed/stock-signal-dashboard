# Builds the dashboard and publishes it to GitHub Pages.
# Runs on every push, twice each weekday (to refresh chart data), or by hand.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 21 * * 1-5"
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Fetch daily chart data
        run: node scripts/fetch-candles.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
